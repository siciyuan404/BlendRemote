name: Build Android APK

on:
  push:
    branches: [main, master]
    paths:
      - 'android/**'
      - 'crates/**'
      - '.github/workflows/build-android.yml'
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
    paths:
      - 'android/**'
      - 'crates/**'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG=${GITHUB_REF##*/}          # v0.1.0
          VER=${TAG#v}                    # 0.1.0
          MAJOR=$(echo "$VER" | cut -d. -f1)
          MINOR=$(echo "$VER" | cut -d. -f2)
          PATCH=$(echo "$VER" | cut -d. -f3)
          VCODE=$(( MAJOR*10000 + MINOR*100 + PATCH ))
          echo "Injecting versionName=$VER versionCode=$VCODE"
          sed -i "s/versionCode = [0-9]*/versionCode = $VCODE/" android/app/build.gradle.kts
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"$VER\"/" android/app/build.gradle.kts

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi aarch64-linux-android x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --update
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            android/rust-core/target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/*.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build Rust core (per ABI)
        working-directory: android/rust-core
        env:
          RUSTFLAGS: "-C link-arg=-landroid"
        run: |
          set -e
          declare -a TARGETS=(
            "armv7-linux-androideabi:armeabi-v7a"
            "aarch64-linux-android:arm64-v8a"
            "x86_64-linux-android:x86_64"
          )
          for entry in "${TARGETS[@]}"; do
            RUST_TARGET="${entry%%:*}"
            echo "=== Building Rust for $RUST_TARGET ==="
            cargo ndk -t "$RUST_TARGET" -o ../app/src/main/jniLibs build --release
          done

      - name: Check keystore availability
        id: check_keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "has_keystore=true" >> $GITHUB_OUTPUT
          else
            echo "has_keystore=false" >> $GITHUB_OUTPUT
          fi

      - name: Decode release keystore
        if: steps.check_keystore.outputs.has_keystore == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ${{ github.workspace }}/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > ${{ github.workspace }}/keystore/blendremote.keystore.p12
          ls -lh ${{ github.workspace }}/keystore/

      - name: Build APK (signed)
        if: steps.check_keystore.outputs.has_keystore == 'true'
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/keystore/blendremote.keystore.p12
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Build APK (unsigned, fallback)
        if: steps.check_keystore.outputs.has_keystore != 'true'
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK with tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG=${GITHUB_REF##*/}
          APK_DIR=android/app/build/outputs/apk/release
          SRC=$(find "$APK_DIR" -name "app-release*.apk" | head -1)
          DST="$APK_DIR/blendremote-${TAG}.apk"
          cp "$SRC" "$DST"
          echo "DST=$DST" >> $GITHUB_ENV
          ls -lh "$DST"

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: blendremote-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.DST }}
          generate_release_notes: true
          draft: false
          prerelease: false