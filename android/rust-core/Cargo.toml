[package]
name = "blendremote-android-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib"]
name = "blendremote"

[dependencies]
blendremote-net = { path = "../../crates/net" }
blendremote-protocol = { path = "../../crates/protocol" }
jni = { version = "0.21", default-features = false }
tokio = { version = "1", features = ["full"] }
once_cell = "1"
log = "0.4"
android_logger = "0.13"
serde_json = "1"
base64 = "0.22"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"